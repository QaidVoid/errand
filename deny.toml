# Dependency policy, checked by `cargo deny check` and enforced by the CI
# step in .github/workflows/check.yml.

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[advisories]
version = 2
# Nothing is ignored, so every advisory stays in view. CI reports them in a
# job of their own, which no merge waits on.

[bans]
# Duplicate crates are a fact of the current tree (two reqwest, two rand
# stacks) and fixing that is tracked separately, so surface them without
# failing the check.
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
